# jobhunt configuration — aligned to Hritik Rana's profile (new-grad, 0 yrs experience)
#
# Goal: entry-level / fresher software roles ANYWHERE in India where prior
# experience is not required.
#
# Profile focus:
# Full-Stack / Backend / Frontend (React, Next.js, TypeScript, Node.js) | Python / FastAPI
# C++ systems & networking | LLM-powered apps | REST APIs | MySQL / PostgreSQL | Docker | CI/CD
# Entry-level Quality Engineering (pytest, data validation)

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  include_titles:
    - '\bsoftware\s+(?:development\s+)?engineer\b'
    - '\bsde\b'
    - '\bsoftware\s+developer\b'
    - '\b(?:full[- ]?stack|front[- ]?end|back[- ]?end)\s+(?:software\s+)?(?:engineer|developer)\b'
    - '\b(?:web|application|product|javascript|typescript|react(?:\.?js)?|node(?:\.?js)?|python)\s+(?:developer|engineer)\b'
    - '\bassociate\s+(?:software\s+)?(?:engineer|developer)\b'
    - '\b(?:junior|jr)\.?\s+(?:software\s+)?(?:engineer|developer)\b'
    - '\bgraduate\s+(?:software\s+)?engineer\b'
    - '\b(?:software\s+)?engineer\s+trainee\b'
    - '\b(?:ai|genai|llm)\s+(?:software\s+|application\s+)?engineer\b'
    - '\bquality\s+engineer\b'
    - '\bsdet\b'
    - '\bdevops\s+engineer\b'
    - '\bsre\b'
    - '\bsite reliability engineer\b'
    - '(?<!\w)c\+\+(?!\w)\s+(?:software\s+)?(?:engineer|developer)'
    - '\bsoftware\s+engineer\b.*(?<!\w)c\+\+(?!\w)'
    - '\b(intern|internship|trainee)\b.*\b(software|developer|engineer|technology|technical)\b'
    - '\b(software|developer|engineer|technology|technical)\b.*\b(intern|internship|trainee)\b'

  # Anything matching these is dropped even if an include matched.
  exclude_titles:
    - '\b(?:senior|sr|snr|staff|principal|distinguished|fellow|architect|lead|expert|experienced|specialist)\b'
    - '\b(?:mid[- ]level|intermediate)\b'
    - '\b(?:engineer|developer|sde|swe|se|mts)[\s\-]*(?:ii|2|iii|3|iv|4|v|5)\b'
    - '\b(?:level|grade|l|ic)[\s\-]*(?:ii|2|iii|3|iv|4|v|5)\b'
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'
    - '\b(sales|account executive|marketing|recruit|recruiter|support|customer success)\b'
    - '\b(data scientist|machine learning scientist|research scientist)\b'
    - '\b(data engineer|analytics engineer)\b'
    - '\bmobile\b|\bios\b|\bandroid\b'
    - '\bsecurity engineer\b'
    - '\bcloud engineer\b'
    - '\bembedded\b|\bfirmware\b|\bkernel\b|\bdriver\b'

  # Require an explicit fresher / entry-level signal in the title or JD.
  entry_level_patterns:
    - '\b(?:entry[- ]level|new[- ]?grad(?:uate)?s?|recent\s+graduates?|fresh(?:ers?|\s+graduates?)|junior|jr|early[- ]career|college\s+hire|campus\s+(?:hire|hiring|recruit\w*))\b'
    - '\b(?:engineer|developer|sde|swe)[\s\-]*(?:i|1)\b'
    - '\b(?:associate|graduate|trainee|intern(?:ship)?)\b'
    - '\b(?:batch|class|graduating)\s+(?:of\s+)?202[5-8]\b'
    - '\b202[5-8]\s+(?:batch|graduates?|grads?)\b'
    - '\b0\s*(?:[-–]|to)\s*[1-3]\s*\+?\s*(?:years?|yrs?)\b'
    - '\bno\s+(?:prior\s+|previous\s+)?(?:work\s+|industry\s+|professional\s+|relevant\s+)?experience\b'
    - '\bexperience\s+(?:is\s+)?(?:not\s+(?:required|necessary|mandatory)|optional)\b'
    - '\bwithout\s+(?:any\s+)?(?:prior\s+)?experience\b'

  # All-India coverage: major hubs, tier-2 cities and states.
  # (Location strings are matched case-insensitively as substrings.)
  locations:
    - india
    - bangalore
    - bengaluru
    - karnataka
