  # Remote roles must explicitly be based in India.
  remote_locations:
    - india
    - bangalore
    - bengaluru
    - pune
    - hyderabad
    - mumbai
    - delhi
    - gurgaon
    - gurugram
    - noida
    - chennai
    - kolkata
    - ahmedabad
    - indore
    - bhopal

  allow_remote: true

  # Drop postings that REQUIRE 2+ years of experience. Ranges that start at 0 or 1
  # ("0-1 years", "0 to 3 years", "1-2 years") and "no experience required" are kept.
  # To be stricter (also drop "1+ years"), change [2-9] to [1-9] in the numeric patterns.
  exclude_experience_patterns:
    # "3+ years ... experience", "2-4 years of experience", "minimum 5 years ... experience"
    - '(?<![-–\d.])(?<!to )(?<!- )(?<!– )\b(?:[2-9]|1[0-4])\s*\+?\s*(?:(?:[-–]|to)\s*\d+\s*)?(?:years?|yrs?)\b(?!\s*(?:degree|bachelor|college|university|program))[\s\S]{0,80}\bexperience\b'
    # "experience: 3+ years", "experience of at least 2 years"
    - '\bexperience\b[\s\S]{0,40}?(?<![-–\d.])(?<!to )(?<!- )(?<!– )\b(?:[2-9]|1[0-4])\s*\+?\s*(?:(?:[-–]|to)\s*\d+\s*)?(?:years?|yrs?)\b(?!\s*(?:degree|bachelor|college|university|program))'
    # spelled-out numbers: "two years of experience"
    - '(?<!to )\b(?:two|three|four|five|six|seven|eight|nine|ten)\s*\+?\s*(?:years?|yrs?)\b[\s\S]{0,80}\bexperience\b'
    # "prior experience is required" — but NOT "no prior experience required"
    - '(?<!no )(?<!not )(?<!without )(?<!any )\b(?:prior|previous|proven|professional|industry)\s+(?:work\s+)?experience\s+(?:is\s+)?(?:required|mandatory|essential)\b'
  max_age_days: 15

# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8
screen_jd_chars: 1800
draft_jd_chars: 6000
# 0-10 LLM score. 2.0 lets near-misses into the digest; 5.0 keeps it useful for a 0-yr profile.
# (If you only run --scorer keyword, that stub uses a different scale — lower this for dev runs.)
score_threshold: 5.0
max_per_digest: 5

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv